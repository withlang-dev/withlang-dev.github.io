name: Deploy site

# Publishes the repository verbatim to GitHub Pages via the official
# static-artifact path (no Jekyll). This serves every file and subdirectory
# as-is — index.html, installer/*, assets/* — which the legacy
# "build from branch" mode did not do reliably for this tree.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
